[pytest]
DJANGO_SETTINGS_MODULE = neocore.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --cov=apps
    --cov-report=term-missing
    --no-cov-on-fail
testpaths = apps
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
